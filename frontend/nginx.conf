server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 客户端路由(/login、/admin/users)刷新时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 哈希产物:长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
